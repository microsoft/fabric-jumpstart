logical_id: helsinki-public-transport
name: Helsinki Public Transport
description: >-
  Watch a city's buses, trams and ferries move in real time. Authored by Kevin Thomas. A
  notebook polls the public HSL GTFS-RT feed into an Eventstream, an Eventhouse shapes it
  with update policies, and a DirectQuery semantic model drives a KQL dashboard. The
  matching map app ships separately as an Awesome Rayfin template.
