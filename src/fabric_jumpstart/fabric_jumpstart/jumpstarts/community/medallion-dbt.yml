name: Medallion with dbt on Warehouse and Spark
description: >-
  One dbt project builds the same AEMO electricity gold layer on Fabric Warehouse
  (dbt-fabric) and Fabric Spark (dbt-fabricspark), then checks that the two engines
  agree. Pipeline, notebooks and a Direct Lake model per engine included.
