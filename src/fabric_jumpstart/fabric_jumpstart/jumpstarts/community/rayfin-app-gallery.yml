mermaid_diagram: |
  graph LR

    %% LIVE GALLERY SOURCE
    MANIFEST[Awesome Rayfin manifest]:::U2601

    %% DEVELOPER MACHINE
    TERM[Your terminal · Rayfin CLI]:::U1F4BB

    %% FABRIC WORKSPACE
    subgraph Fabric:::Workspace
      direction LR
      NB[RayfinAppGallery]:::Notebook
      APP[Rayfin app · static web]:::U1F310
      DB[App data model]:::SQLDatabase
      UDF[App backend functions]:::UserDataFunction
    end

    MANIFEST -.->|live template list| NB
    NB ==>|copy deploy command| TERM
    TERM -->|npx rayfin up| APP
    TERM -.->|if app uses data| DB
    TERM -.->|if app has backend| UDF
