id: 31
logical_id: sap-manufacturing
name: Talk to your SAP Data - Manufacturing Edition
description: >-
  Ask natural-language questions about synthetic SAP PP / shopfloor data. A grounded
  Fabric Data Agent answers on production orders, the Laser Balancing bottleneck,
  missing parts, scrap and S&OP over a Direct Lake semantic model - deployed end to
  end by fabric-cicd, no real SAP system required.
