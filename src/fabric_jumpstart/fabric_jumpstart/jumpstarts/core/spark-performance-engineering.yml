  repo_ref: v0.1.0
  workspace_path: workspace/
items_in_scope:
- Lakehouse
- Notebook
- Environment
- SparkJobDefinition
jumpstart_docs_uri: https://jumpstart.fabric.microsoft.com/catalog/spark-performance-engineering
