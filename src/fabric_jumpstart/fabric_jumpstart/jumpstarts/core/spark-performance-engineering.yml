id: 28
logical_id: spark-performance-engineering
name: Spark Performance Engineering
description: >-
  Self-guided, hands-on tutorial for finding and fixing Apache Spark
  performance problems in Microsoft Fabric. Work through sub-optimal
  workloads on a synthetic Toy Brick lakehouse, following the code → data →
  execution tuning hierarchy with before-and-after benchmarks.
