mermaid_diagram: |
  graph LR

      %% Symbolic source events landed into the toy_bricks lakehouse.
      MFG[Manufacturing Events]:::U1F3ED
      WEB[Web Orders]:::U1F6D2

      %% Data generation feeds bronze Delta tables that every module reads.
      subgraph Fabric:::Workspace
          direction LR

          GS[00_getting-started]:::Notebook

          DGE[datagen_env]:::Environment
          SNE[single_node_explore]:::Environment

          SJD[source_to_bronze]:::SparkJobDefinition
          SJDO[source_to_bronze_optimized]:::SparkJobDefinition

          TB[toy_bricks]:::Lakehouse
          TBO[toy_bricks_optimized]:::Lakehouse

          BU[_benchmark_utils]:::Notebook
          M1[01_optimizing-code]:::Notebook
          M2[02_optimizing-tables]:::Notebook
          M3[03_optimizing-execution]:::Notebook
      end

      %% Source events land in toy_bricks; source_to_bronze reads landing
      %% files from and writes bronze tables to the same lakehouse.
      MFG -.-> TB
      WEB -.-> TB
      SJD --- DGE
      SJDO --- DGE
      TB <-.-> SJD
      TBO <-.-> SJDO

      %% Modules read the seeded lakehouse and reuse shared benchmark helpers.

      M1 --- SNE
      M2 --- SNE
      M3 --- SNE

